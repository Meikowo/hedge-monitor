name: Collect Official Risk Sources

on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Official exchange source'
        required: true
        type: choice
        options:
          - all
          - sse
          - szse
        default: all
      kind:
        description: 'Supervision document type'
        required: true
        type: choice
        options:
          - all
          - inquiry
          - regulatory_measure
          - disciplinary_action
        default: all
      start_date:
        description: 'Start date YYYY-MM-DD'
        required: true
        default: '2024-01-01'
      end_date:
        description: 'End date YYYY-MM-DD (blank means today)'
        required: false
        default: ''
      max_pages:
        description: 'Maximum pages per document type'
        required: true
        default: '5'
      limit:
        description: 'Maximum documents per source'
        required: true
        default: '500'
      fetch_body:
        description: 'Fetch and classify document bodies'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      write:
        description: 'Write candidates to Supabase'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      confirm_write:
        description: 'When write=true, enter I_UNDERSTAND'
        required: false
        default: ''

concurrency:
  group: risk-sources
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate manual write confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          WRITE: ${{ github.event.inputs.write }}
          CONFIRM_WRITE: ${{ github.event.inputs.confirm_write }}
        run: |
          if [ "$WRITE" = "true" ] && [ "$CONFIRM_WRITE" != "I_UNDERSTAND" ]; then
            echo "write=true requires confirm_write=I_UNDERSTAND"
            exit 1
          fi
      - name: Discover and classify official documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE: ${{ github.event.inputs.source }}
          KIND: ${{ github.event.inputs.kind }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          LIMIT: ${{ github.event.inputs.limit }}
          FETCH_BODY: ${{ github.event.inputs.fetch_body }}
          WRITE: ${{ github.event.inputs.write }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            SOURCE="all"
            KIND="all"
            START_DATE="$(python -c 'import datetime as d; print((d.date.today()-d.timedelta(days=29)).isoformat())')"
            END_DATE="$(python -c 'import datetime as d; print(d.date.today().isoformat())')"
            MAX_PAGES="20"
            LIMIT="1000"
            FETCH_BODY="true"
            WRITE="true"
          fi

          args=(
            --source "$SOURCE"
            --kind "$KIND"
            --start-date "$START_DATE"
            --max-pages "$MAX_PAGES"
            --limit "$LIMIT"
          )
          if [ -n "$END_DATE" ]; then
            args+=(--end-date "$END_DATE")
          fi
          if [ "$FETCH_BODY" = "false" ]; then
            args+=(--no-fetch-body)
          fi
          if [ "$WRITE" = "true" ]; then
            args+=(--write)
          fi
          python scripts/fetch_risk_documents.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-sources-${{ github.run_id }}
          path: output/risk_documents_*.csv
          if-no-files-found: ignore
          retention-days: 30
