name: Periodic Reports Formal

# M4 年报管线：手动模式保留显式确认，定时模式排空固定的 2025 正式池。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: '阶段：metadata / locate / extract'
        required: true
        default: 'metadata'
        type: choice
        options: [metadata, locate, extract]
      sample_set:
        description: '样本集：6份验证组 / 30份POC / 120家优先池 / 1812家正式池'
        required: true
        default: 'validation6'
        type: choice
        options: [validation6, poc30, priority120, formal1812]
      limit:
        description: 'locate/extract 最多处理份数'
        required: false
        default: '2'
      confirm_llm:
        description: 'extract 时确认产生模型调用'
        required: false
        default: false
        type: boolean
      retry_failed:
        description: 'locate 时显式重试 failed'
        required: false
        default: false
        type: boolean
      report_id:
        description: '显式恢复单份报告；留空时使用普通队列'
        required: false
        default: ''
  schedule:
    # 每天北京时间 05:20：只更新 2025 年报元数据
    - cron: '20 21 * * *'
    # 每天北京时间 00:45、06:45、12:45、18:45：定位与抽取队列
    - cron: '45 22,4,10,16 * * *'

concurrency:
  group: cninfo
  cancel-in-progress: false

jobs:
  periodic-poc:
    if: ${{ github.event_name != 'schedule' || vars.PERIODIC_AUTO_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LLM_THINKING: 'off'
      SAMPLE_FILE: ${{ github.event_name == 'schedule' && 'config/annual_formal_2025.csv' || inputs.sample_set == 'formal1812' && 'config/annual_formal_2025.csv' || inputs.sample_set == 'validation6' && 'config/annual_validation_2025.csv' || inputs.sample_set == 'priority120' && 'config/annual_priority_2025.csv' || 'config/annual_poc_2025.csv' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Discover 2025 annual reports
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'metadata'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_periodic_reports.py --sample "$SAMPLE_FILE" --fiscal-year 2025 --report-type annual --write
      - name: Locate candidate pages manually (no LLM)
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'locate'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH_LIMIT: ${{ inputs.limit }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
          REPORT_ID: ${{ inputs.report_id }}
        run: |
          EXTRA_ARGS=()
          if [ "$RETRY_FAILED" = "true" ]; then EXTRA_ARGS+=(--retry-failed); fi
          if [ -n "$REPORT_ID" ]; then EXTRA_ARGS+=(--report-id "$REPORT_ID"); fi
          python scripts/locate_periodic_pages.py --sample "$SAMPLE_FILE" --fiscal-year 2025 --report-type annual --limit "$BATCH_LIMIT" --write "${EXTRA_ARGS[@]}"
      - name: Guard LLM confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'extract' && !inputs.confirm_llm
        run: |
          echo "extract 阶段必须勾选 confirm_llm"
          exit 2
      - name: Extract annual reports manually (LLM)
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'extract' && inputs.confirm_llm
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          REPORT_ID: ${{ inputs.report_id }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$REPORT_ID" ]; then EXTRA_ARGS+=(--report-id "$REPORT_ID"); fi
          python scripts/extract_periodic_reports.py --sample "$SAMPLE_FILE" --fiscal-year 2025 --report-type annual --limit "${{ inputs.limit }}" --confirm-llm "${EXTRA_ARGS[@]}"
      - name: Report formal progress before batch
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/periodic_progress.py --sample "$SAMPLE_FILE" --fiscal-year 2025 --report-type annual
      - name: Auto-discover formal reports (no LLM)
        if: github.event_name == 'schedule' && github.event.schedule == '20 21 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_periodic_reports.py --sample "$SAMPLE_FILE" --fiscal-year 2025 --report-type annual --strategy full --write
      - name: Auto-locate formal reports (no LLM)
        if: github.event_name == 'schedule' && github.event.schedule == '45 22,4,10,16 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/locate_periodic_pages.py --sample "$SAMPLE_FILE" --fiscal-year 2025 --report-type annual --limit 48 --write
      - name: Auto-extract formal reports (LLM)
        if: github.event_name == 'schedule' && github.event.schedule == '45 22,4,10,16 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/extract_periodic_reports.py --sample "$SAMPLE_FILE" --fiscal-year 2025 --report-type annual --limit 36 --confirm-llm
      - name: Report formal progress after batch
        if: github.event_name == 'schedule' && always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/periodic_progress.py --sample "$SAMPLE_FILE" --fiscal-year 2025 --report-type annual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: periodic-${{ github.event_name }}-${{ github.run_id }}
          path: output/*
          if-no-files-found: ignore
          retention-days: 30
